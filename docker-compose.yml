version: "3.9"

services:
  api:
    build: .
    container_name: multimodal-agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env                        # API 키는 .env 파일에서 주입
    volumes:
      - ./data:/app/data            # ChromaDB & 지식베이스 영속 저장
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

